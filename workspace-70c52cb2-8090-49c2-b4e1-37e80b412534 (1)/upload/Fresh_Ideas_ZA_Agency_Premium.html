
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh Ideas ZA | Agency Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/split-type"></script>
<script src="https://unpkg.com/@studio-freight/lenis@1.0.5/bundled/lenis.min.js"></script>

<style>
:root{
--bg:#0C0F14;
--surface:#151A21;
--text:#F4F6F8;
--accent:#00D1B2;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
overflow-x:hidden;
cursor:none;
}

/* Cursor */
.cursor{
width:20px;height:20px;
border:2px solid var(--accent);
border-radius:50%;
position:fixed;
pointer-events:none;
z-index:9999;
transform:translate(-50%,-50%);
}

/* Transition */
.page-transition{
position:fixed;
width:100%;
height:100%;
background:var(--accent);
top:0;left:0;
z-index:3000;
}

/* Nav */
nav{
position:fixed;
width:100%;
padding:20px 8%;
display:flex;
justify-content:space-between;
background:rgba(12,15,20,0.8);
backdrop-filter:blur(10px);
z-index:1000;
}

nav a{color:var(--text);text-decoration:none;margin-left:30px;}

/* Hero */
.hero{
position:relative;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.hero video{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
top:0;left:0;
z-index:1;
}

.hero-overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(12,15,20,0.7);
z-index:2;
}

.hero-content{
position:relative;
z-index:3;
}

.hero h1{
font-size:4rem;
font-weight:800;
}

.btn{
margin-top:30px;
padding:14px 30px;
background:var(--accent);
color:#000;
border:none;
border-radius:40px;
font-weight:600;
cursor:pointer;
}

/* Sections */
section{
padding:120px 8%;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
}

.card{
background:var(--surface);
padding:40px;
border-radius:12px;
}

/* Horizontal Portfolio */
.horizontal-section{
position:relative;
height:100vh;
overflow:hidden;
}

.horizontal-wrapper{
display:flex;
height:100%;
}

.panel{
min-width:100vw;
display:flex;
justify-content:center;
align-items:center;
font-size:2rem;
background:var(--surface);
border-right:1px solid #222;
}

/* Contact */
form input, form textarea{
width:100%;
padding:14px;
margin-bottom:20px;
background:var(--surface);
border:1px solid #333;
color:var(--text);
border-radius:8px;
}

footer{
padding:40px;
text-align:center;
background:#0a0d12;
}
</style>
</head>

<body>

<div class="page-transition"></div>
<div class="cursor"></div>

<nav>
<div>Fresh Ideas ZA</div>
<div>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Work</a>
<a href="#">Contact</a>
</div>
</nav>

<section class="hero">
<video autoplay muted loop playsinline>
<source src="https://www.w3schools.com/howto/rain.mp4" type="video/mp4">
</video>
<div class="hero-overlay"></div>
<div class="hero-content">
<h1 class="split">Design. Build. Elevate.</h1>
<button class="btn">Start a Project</button>
</div>
</section>

<section>
<h2>Our Services</h2>
<div class="grid">
<div class="card">Brand Identity</div>
<div class="card">Web & App Development</div>
<div class="card">Photography & Film</div>
</div>
</section>

<section class="horizontal-section">
<div class="horizontal-wrapper">
<div class="panel">Corporate Branding</div>
<div class="panel">Wedding Cinematic Film</div>
<div class="panel">School Management App</div>
<div class="panel">Safety Training Video</div>
</div>
</section>

<section>
<h2>Contact Us</h2>
<form action="mailto:info@freshideasza.co.za" method="POST" enctype="text/plain">
<input type="text" name="name" placeholder="Your Name" required>
<input type="email" name="email" placeholder="Your Email" required>
<textarea name="message" rows="5" placeholder="Your Message" required></textarea>
<button class="btn">Send Message</button>
</form>
</section>

<footer>
© 2026 Fresh Ideas ZA — Agency Premium Edition
</footer>

<script>
gsap.registerPlugin(ScrollTrigger);

/* Smooth Scroll */
const lenis = new Lenis();
function raf(time){lenis.raf(time);requestAnimationFrame(raf);}
requestAnimationFrame(raf);

/* Transition */
gsap.to(".page-transition",{yPercent:-100,duration:1.2,ease:"power4.inOut"});

/* Cursor */
const cursor=document.querySelector(".cursor");
document.addEventListener("mousemove",e=>{
gsap.to(cursor,{x:e.clientX,y:e.clientY,duration:0.2});
});

/* Split Text */
const text=new SplitType(".split",{types:"chars"});
gsap.from(".char",{y:100,opacity:0,stagger:0.05,duration:1});

/* Horizontal Scroll */
const panels=gsap.utils.toArray(".panel");
gsap.to(panels,{
xPercent:-100*(panels.length-1),
ease:"none",
scrollTrigger:{
trigger:".horizontal-section",
pin:true,
scrub:1,
snap:1/(panels.length-1),
end:()=>"+="+document.querySelector(".horizontal-wrapper").offsetWidth
}
});
</script>

</body>
</html>
